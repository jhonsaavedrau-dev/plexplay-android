name: Compilar rama (sin publicar)
# Comprueba que una rama de trabajo compila. NO firma ni crea releases: solo deja el APK de depuración como
# artefacto de la ejecución. Las versiones para estudiantes siguen saliendo solo de main (build.yml).
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Íconos de Manzana
        run: |
          pip install --quiet pillow
          python3 scripts/icons.py
      - name: Compilar APK de depuración
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PLEX-PLAY-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
